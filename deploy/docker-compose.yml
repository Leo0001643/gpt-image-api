# =====================================================
# GPT Image API · 单机生产 docker-compose
# 启动：docker compose --env-file ./env/.env.local up -d
# 端口策略见 docs/01-开发规范-总览.md §端口规范
# =====================================================

x-common-env: &common-env
  GIA_ENV:              ${GIA_ENV:-prod}
  # 数据库 / 缓存
  GIA_DB_DSN:           ${GIA_DB_DSN}
  GIA_REDIS_ADDR:       ${GIA_REDIS_ADDR:-redis:6379}
  GIA_REDIS_PASSWORD:   ${GIA_REDIS_PASSWORD:-}
  # 安全密钥
  GIA_JWT_SECRET:       ${GIA_JWT_SECRET}
  GIA_JWT_REFRESH_SECRET: ${GIA_JWT_REFRESH_SECRET}
  GIA_AES_KEY:          ${GIA_AES_KEY}
  # Provider
  GIA_OPENAI_BASE:      ${GIA_OPENAI_BASE:-https://api.openai.com}
  GIA_GROK_BASE:        ${GIA_GROK_BASE:-https://api.x.ai}
  GIA_PROVIDER_GPT:     ${GIA_PROVIDER_GPT:-real}
  GIA_PROVIDER_GROK:    ${GIA_PROVIDER_GROK:-real}
  # 跨域 / 日志
  GIA_CORS_ORIGINS:     ${GIA_CORS_ORIGINS}
  GIA_LOG_DIR:          /app/logs
  TZ:                   Asia/Shanghai

services:
  mysql:
    image: mysql:8.0
    container_name: gia-mysql
    restart: always
    command:
      - --default-authentication-plugin=caching_sha2_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --innodb-buffer-pool-size=2G
      - --max_connections=300
      - --sql-mode=STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION
    environment:
      MYSQL_ROOT_PASSWORD: ${GIA_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${GIA_MYSQL_DB:-gpt_image_api}
      MYSQL_USER: ${GIA_MYSQL_USER:-gia}
      MYSQL_PASSWORD: ${GIA_MYSQL_PASSWORD}
      # 远程运维只读写账号（仅 DML 权限）
      GIA_DB_OPS_USER: ${GIA_DB_OPS_USER:-giaops}
      GIA_DB_OPS_PASSWORD: ${GIA_DB_OPS_PASSWORD:-}
    ports:
      - "${GIA_MYSQL_PORT:-33306}:3306"  # 临时对外暴露，后期改回 127.0.0.1:
    volumes:
      - gia-mysql-data:/var/lib/mysql
      # 首次初始化时执行 goose Up 段，避免 mysql 直接执行 Down 把表删空
      - ./mysql-init/01-run-migrations.sh:/docker-entrypoint-initdb.d/01-run-migrations.sh:ro
      - ./mysql-init/02-create-remote-user.sh:/docker-entrypoint-initdb.d/02-create-remote-user.sh:ro
      - ../backend/migrations:/migrations:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      retries: 6
    networks: [gia]

  redis:
    image: redis:7-alpine
    container_name: gia-redis
    restart: always
    command: redis-server --appendonly yes ${GIA_REDIS_PASSWORD:+--requirepass ${GIA_REDIS_PASSWORD}}
    ports:
      - "${GIA_REDIS_PORT:-16379}:6379"  # 临时对外暴露，后期改回 127.0.0.1:
    volumes:
      - gia-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 6
    networks: [gia]

  api:
    image: gpt-image-api/backend:latest
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: gia-api
    restart: always
    command: ["/app/api"]
    environment:
      <<: *common-env
      GIA_NODE_ID: 1
    expose: ["17180"]
    volumes:
      - /opt/gpt-image-api/logs:/app/logs
      - gia-storage:/app/storage
    depends_on:
      mysql:  { condition: service_healthy }
      redis:  { condition: service_healthy }
    healthcheck:
      disable: true
    deploy:
      resources:
        limits: { cpus: '2', memory: 1G }
    networks: [gia]

  admin:
    image: gpt-image-api/backend:latest
    container_name: gia-admin
    restart: always
    command: ["/app/admin"]
    environment:
      <<: *common-env
      GIA_NODE_ID: 2
    expose: ["17188"]
    volumes:
      - /opt/gpt-image-api/logs:/app/logs
    depends_on:
      mysql:  { condition: service_healthy }
      redis:  { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: '1', memory: 512M }
    networks: [gia]

  openai:
    image: gpt-image-api/backend:latest
    container_name: gia-openai
    restart: always
    command: ["/app/openai"]
    environment:
      <<: *common-env
      GIA_NODE_ID: 3
    expose: ["17200"]
    volumes:
      - /opt/gpt-image-api/logs:/app/logs
      - gia-storage:/app/storage
    depends_on:
      mysql:  { condition: service_healthy }
      redis:  { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: '2', memory: 1G }
    networks: [gia]

  worker:
    image: gpt-image-api/backend:latest
    container_name: gia-worker
    restart: always
    command: ["/app/worker"]
    environment:
      <<: *common-env
      GIA_NODE_ID: 4
    volumes:
      - /opt/gpt-image-api/logs:/app/logs
      - gia-storage:/app/storage
    depends_on:
      mysql:  { condition: service_healthy }
      redis:  { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: '2', memory: 1G }
    networks: [gia]

  user-web:
    image: gpt-image-api/user-web:latest
    build:
      context: ../frontend
      dockerfile: apps/user/Dockerfile
    container_name: gia-user-web
    restart: always
    expose: ["80"]
    networks: [gia]

  admin-web:
    image: gpt-image-api/admin-web:latest
    build:
      context: ../frontend
      dockerfile: apps/admin/Dockerfile
    container_name: gia-admin-web
    restart: always
    expose: ["80"]
    networks: [gia]

  nginx:
    image: nginx:1.27-alpine
    container_name: gia-nginx
    restart: always
    depends_on: [api, admin, openai, user-web, admin-web]
    ports:
      - "${GIA_ADMIN_WEB_PORT:-17080}:17080"
      - "${GIA_USER_WEB_PORT:-17088}:17088"
      - "${GIA_OPENAI_PORT:-17200}:17200"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
      - /opt/gpt-image-api/logs/nginx:/var/log/nginx
    networks: [gia]

volumes:
  gia-mysql-data:
  gia-redis-data:
  gia-storage:

networks:
  gia:
    name: gia-net
