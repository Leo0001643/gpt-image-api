# =====================================================
# GPT Image API · 全容器本地开发栈
#
# 与 docker-compose.dev.yml 的差别：
#   - dev.yml         只起 mysql + redis，业务进程主机直跑（go run / pnpm dev）
#   - dev-full.yml    全部 7 个服务都跑容器（适合不想装 Go / Node 的同学）
#
# 启动：
#   cd deploy
#   docker compose -f docker-compose.dev-full.yml up -d --build
#
# 端口（host -> container）：
#   user-web    : 17080 -> 80     (→ 静态前端 + /api/* 代理 api:17180 + /v1/* 代理 openai:17200)
#   admin-web   : 17088 -> 80     (→ 静态前端 + /admin/api/* 代理 admin:17188)
#   api         : 17180 -> 17180  (可选直连用户 API，调试用)
#   admin       : 17188 -> 17188  (可选直连后台 API，调试用)
#   openai      : 17200 -> 17200  (可选直连 OpenAI 兼容 API)
#   mysql       : 23306 -> 3306   (Hyper-V 占了 13306，临时换 23306)
#   redis       : 16379 -> 6379
# =====================================================

x-backend-env: &backend-env
  GIA_ENV: prod
  GIA_DB_DSN: klein:LlPZkkhrJMEF6Q1aVRBWGQ@tcp(mysql:3306)/gpt_image_api?charset=utf8mb4&parseTime=True&loc=Local
  GIA_REDIS_ADDR: redis:6379
  GIA_REDIS_PASSWORD: 'LlPZkkhrJMEF6Q1aVRBWGQ'
  GIA_REDIS_DB: '0'
  GIA_JWT_SECRET: local-dev-jwt-secret-32bytes-please-change
  GIA_JWT_REFRESH_SECRET: local-dev-jwt-refresh-secret-32bytes-please
  GIA_JWT_ACCESS_TTL: 2h
  GIA_JWT_REFRESH_TTL: 336h
  GIA_AES_KEY: '00000000000000000000000000000000'
  GIA_PROVIDER_GPT: real
  GIA_PROVIDER_GROK: real
  GIA_OPENAI_BASE: https://api.openai.com
  GIA_GROK_BASE: https://api.x.ai
  GIA_GPT_BASE_URL: https://api.openai.com
  GIA_GROK_BASE_URL: https://grok.com
  GIA_GROK_CF_STATE_PATH: /app/storage/grok_cf.json
  GIA_GROK_UPLOAD_NORMALIZE_JPEG: 'true'
  GIA_GROK_DYNAMIC_STATSIG: 'true'
  GIA_LOG_LEVEL: info
  GIA_LOG_DIR: /app/logs
  GIA_CORS_ORIGINS: http://localhost:17080,http://localhost:17088,http://127.0.0.1:17080,http://127.0.0.1:17088,http://43.230.9.103:17080,http://43.230.9.103:17088
  TZ: Asia/Shanghai

services:
  mysql:
    image: mysql:8.0
    container_name: gia-mysql-dev
    restart: unless-stopped
    command:
      - --default-authentication-plugin=caching_sha2_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --innodb-buffer-pool-size=512M
      - --max_connections=200
      - --binlog-expire-logs-seconds=86400
      - --max-binlog-size=64M
      - --sql-mode=STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION
    environment:
      MYSQL_ROOT_PASSWORD: LlPZkkhrJMEF6Q1aVRBWGQ
      MYSQL_DATABASE: gpt_image_api
      MYSQL_USER: gia
      MYSQL_PASSWORD: LlPZkkhrJMEF6Q1aVRBWGQ
      GIA_DB_OPS_USER: ${GIA_DB_OPS_USER:-giaops}
      GIA_DB_OPS_PASSWORD: ${GIA_DB_OPS_PASSWORD:-}
      TZ: Asia/Shanghai
    ports:
      - "0.0.0.0:${GIA_DEV_REDIS_PORT:-23306}:3306"
    volumes:
      - gia-mysql-dev-data:/var/lib/mysql
      - ./mysql-init/01-run-migrations.sh:/docker-entrypoint-initdb.d/01-run-migrations.sh:ro
      - ./mysql-init/02-create-remote-user.sh:/docker-entrypoint-initdb.d/02-create-remote-user.sh:ro
      - ../backend/migrations:/migrations:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pLlPZkkhrJMEF6Q1aVRBWGQ"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [gia-dev]

  redis:
    image: redis:7-alpine
    container_name: gia-redis-dev
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:${GIA_DEV_REDIS_PORT:-16379}:6379"
    volumes:
      - gia-redis-dev-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [gia-dev]

  # ---------- 4 个后端 cmd ----------
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: gia-flaresolverr-dev
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:18191:8191"
    networks: [gia-dev]

  api:
    image: gpt-image-api/backend:dev
    container_name: gia-api-dev
    build:
      context: ../backend
      dockerfile: Dockerfile
    entrypoint: ["/app/api"]
    user: "0:0"            # 复用同一镜像同一卷写日志，方便起见 dev 用 root
    environment:
      <<: *backend-env
      GIA_NODE_ID: '1'
    ports:
      - "127.0.0.1:17180:17180"
    volumes:
      - gia-logs:/app/logs
      - gia-storage:/app/storage
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      flaresolverr: { condition: service_started }
    networks: [gia-dev]
    restart: unless-stopped

  admin:
    image: gpt-image-api/backend:dev
    container_name: gia-admin-dev
    entrypoint: ["/app/admin"]
    user: "0:0"
    environment:
      <<: *backend-env
      GIA_NODE_ID: '2'
    ports:
      - "127.0.0.1:17188:17188"
    volumes:
      - gia-logs:/app/logs
      - gia-storage:/app/storage
    depends_on:
      api: { condition: service_started }
    networks: [gia-dev]
    restart: unless-stopped

  openai:
    image: gpt-image-api/backend:dev
    container_name: gia-openai-dev
    entrypoint: ["/app/openai"]
    user: "0:0"
    environment:
      <<: *backend-env
      GIA_NODE_ID: '3'
    ports:
      - "127.0.0.1:17200:17200"
    volumes:
      - gia-logs:/app/logs
      - gia-storage:/app/storage
    depends_on:
      api: { condition: service_started }
    networks: [gia-dev]
    restart: unless-stopped

  worker:
    image: gpt-image-api/backend:dev
    container_name: gia-worker-dev
    entrypoint: ["/app/worker"]
    user: "0:0"
    environment:
      <<: *backend-env
      GIA_NODE_ID: '4'
    volumes:
      - gia-logs:/app/logs
      - gia-storage:/app/storage
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      flaresolverr: { condition: service_started }
    networks: [gia-dev]
    restart: unless-stopped

  # ---------- 前端静态 + 反代 ----------
  user-web:
    image: gpt-image-api/user-web:dev
    container_name: gia-user-web-dev
    build:
      context: ../frontend
      dockerfile: apps/user/Dockerfile
    ports:
      - "17080:80"
    volumes:
      # 覆盖镜像内自带的 nginx.conf，加入 /api 与 /v1 反代
      - ./nginx-dev/user-web.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api, openai]
    networks: [gia-dev]
    restart: unless-stopped

  admin-web:
    image: gpt-image-api/admin-web:dev
    container_name: gia-admin-web-dev
    build:
      context: ../frontend
      dockerfile: apps/admin/Dockerfile
    ports:
      - "17088:80"
    volumes:
      - ./nginx-dev/admin-web.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [admin]
    networks: [gia-dev]
    restart: unless-stopped

  edge:
    image: caddy:2-alpine
    container_name: gia-edge-dev
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - gia-caddy-data:/data
      - gia-caddy-config:/config
    depends_on: [user-web]
    networks: [gia-dev]
    restart: unless-stopped

volumes:
  gia-mysql-dev-data:
  gia-redis-dev-data:
  gia-logs:
  gia-storage:
  gia-caddy-data:
  gia-caddy-config:

networks:
  gia-dev:
    name: gia-dev-net
