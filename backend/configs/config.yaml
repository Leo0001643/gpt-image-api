# GPT Image API · 配置文件
# 优先级：环境变量 > 本文件
# 环境变量前缀 GIA_，层级用 _ 连接，如 GIA_LOG_LEVEL

app:
  name: gpt-image-api
  env:  prod                  # 由 GIA_ENV 覆盖

server:
  api_port:         17180
  admin_port:       17188
  openai_port:      17200
  ws_port:          17280
  pprof_port:       17590
  read_timeout:     30s
  write_timeout:    60s
  shutdown_timeout: 15s

mysql:
  dsn:               ""        # 必填：由 GIA_DB_DSN 注入
  max_open_conns:   100
  max_idle_conns:   20
  conn_max_lifetime: 1h
  slow_threshold:   200ms

redis:
  addr:      ""                # 必填：由 GIA_REDIS_ADDR 注入
  password:  ""
  db:        0
  pool_size: 50

jwt:
  access_ttl:  2h
  refresh_ttl: 336h            # 14 天

logger:
  level:        info
  dir:          /app/logs      # 由 GIA_LOG_DIR 覆盖，bind mount 到宿主机
  max_size_mb:  200
  max_age_days: 30
  compress:     true
  console:      false          # 生产不输出控制台，日志全写文件

snowflake:
  node_id: 1                   # 由 GIA_NODE_ID 覆盖（多副本须不同）

cors:
  origins: []                  # 由 GIA_CORS_ORIGINS 注入

ratelimit:
  ip_per_minute:     1200
  user_per_minute:   600
  apikey_per_minute: 60

pool:
  strategy:             round_robin   # round_robin | weighted | least_used | lowest_err_rate
  cooldown_seconds:     600
  fail_threshold:       5
  health_check_seconds: 300

provider:
  openai_base:     https://api.openai.com
  grok_base:       https://api.x.ai
  request_timeout: 120s
  retry:           1

billing:
  point_unit: 100              # 1 显示点 = 100 最小单位

cdn:
  base: ""
